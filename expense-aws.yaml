- name: craete ec2 and r53 records
  hosts: localhost
  vars:
    zone: venkymadhumanchi.shop
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      name: "{{ item }}"
      security_group: allow-all 
      image_id: ami-0220d79f3f480ecf5
      tags:
        Name: "{{ item }}"

    loop:
    - "{{ instance }}"
    register: ec2_instance_info

  - name: print output
    ansible.builtin.debug:
       msg: "Output: {{ ec2_instance_info }}"

  - name: create r53 records
    amazon.aws.route53:
     state: present
     zone: "{{ zone }}"
     record: "{{ item }}.{{ zone }}"
     type: A
     value: "{{ item.private_ip_address }}"
     overwrite: true
     ttl: 1
    loop: "{{ ec2_instance_info.results.instance }}"


