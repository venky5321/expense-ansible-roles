- name: craete ec2 and r53 records
  hosts: localhost
  vars:
    zone: venkymadhumanchi.shop
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      name: "{{ item }}"
      security_group: allow-all 
      image_id: ami-0220d79f3f480ecf5
      tags:
        Name: "{{ item }}"

    loop:
    - db
    - backend
    - frontend
    register: ec2_instance_info

  - name: print output
    ansible.builtin.debug:
       msg: "Output: {{ ec2_instance_info }}"
